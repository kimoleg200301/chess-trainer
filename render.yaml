# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free trial: web service sleeps after 15 idle minutes; PostgreSQL expires in 30 days.
# Export your progress before the database expires. See deploy/CLOUD.md.
previews:
  generation: "off"

services:
  - type: web
    name: tactics-trial
    runtime: docker
    region: frankfurt
    plan: free
    dockerContext: .
    dockerfilePath: ./deploy/Dockerfile.render-free
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tactics-trial-db
          property: connectionString
      - key: AUTH_USERNAME
        value: trainer
      - key: AUTH_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_HOST
        fromService:
          name: tactics-trial
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: FRONTEND_DIST
        value: /app/web
      - key: DATA_PATH
        value: /app/data/puzzles.csv
      - key: STOCKFISH_PATH
        value: /usr/games/stockfish
      - key: PORT
        value: "10000"

databases:
  - name: tactics-trial-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    databaseName: tactics
    user: tactics
    ipAllowList: []
